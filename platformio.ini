[env:esp12f]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

extra_scripts =
  pre:scripts/compiledb_settings.py

build_flags =
    !python scripts/compiledb.py
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -std=gnu++20
    -O3
    -fomit-frame-pointer
    -I include/

build_unflags =
    -Os -std=gnu++17 -fno-inline-functions
